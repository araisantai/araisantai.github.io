title: Arai Notes
description: Arai's personal journal of learning, reflection, and steady progress.
url: "https://araisantai.github.io"
baseurl: ""
lang: en
timezone: Asia/Bangkok

author:
  name: Arai

contact:
  email: array385@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-sitemap

blog_categories:
  - slug: cybersecurity
    title: Cyber Security
    url: /cybersecurity/
    emoji: "🛡️"
    color: "#38bdf8"
    description: Ethical, defensive security notes for safer systems, habits, and workflows.
  - slug: finance
    title: Finance
    url: /finance/
    emoji: "📊"
    color: "#f59e0b"
    description: Personal finance learning, money habits, journaling, and long-term thinking.
  - slug: books
    title: Books
    url: /books/
    emoji: "📚"
    color: "#818cf8"
    description: Reading journals, thoughtful reviews, and ideas worth revisiting.

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Arai

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
